name: AEON Project Tracker

on:
  # Trigger 1: Manual dispatch with Task ID and Status inputs
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID"
        required: true
        type: string
      status:
        description: "Status"
        required: true
        type: choice
        options:
          - Not Started
          - In Progress
          - Under Review
          - Completed

  # Trigger 2a: Branch created via GitHub UI/API
  create:

  # Trigger 2b: Branch created by pushing from local git
  push:
    branches:
      - '*/task-id-*'

  # Trigger 3 & 4 & 5: PR opened, edited, or closed (merged) targeting develop
  pull_request:
    types: [opened, edited, closed]
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  track-task:
    runs-on: ubuntu-latest
    environment: develop
    # Only run if:
    # - create event: branch name contains /task-id-
    # - pull_request event: source branch name contains /task-id-
    # - workflow_dispatch: always run
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'create' && github.ref_type == 'branch' &&
        contains(github.ref, '/task-id-')) ||
      (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' &&
        contains(github.ref, '/task-id-')) ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.head.ref, '/task-id-'))

    steps:
      - name: Resolve Task ID and Status
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          MANUAL_TASK_ID: ${{ inputs.task_id }}
          MANUAL_STATUS: ${{ inputs.status }}
        run: |
          TASK_ID=""
          STATUS=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Trigger 1: Manual — use inputs directly
            TASK_ID="$MANUAL_TASK_ID"
            STATUS="$MANUAL_STATUS"

          elif [ "$EVENT" = "create" ] || ([ "$EVENT" = "push" ] && [ "$BEFORE" = "0000000000000000000000000000000000000000" ]); then
            # Trigger 2: New branch created via GitHub UI or pushed from local git
            BRANCH_NAME="${REF#refs/heads/}"
            TASK_ID=$(echo "$BRANCH_NAME" | grep -ioP '(?<=task-id-)\d+')
            STATUS="In Progress"

          elif [ "$EVENT" = "pull_request" ]; then
            # Trigger 3 & 4: Extract task ID from the source branch name
            TASK_ID=$(echo "$PR_BRANCH" | grep -ioP '(?<=task-id-)\d+')

            if [ "$PR_MERGED" = "true" ]; then
              # Trigger 4: PR merged → Completed
              STATUS="Completed"
            else
              # Trigger 3: PR opened/edited → Under Review
              STATUS="Under Review"
            fi
          fi

          # Abort if no task ID was found or branch does not match expected format
          if [ -z "$TASK_ID" ]; then
            echo "Branch does not match <username>/task-id-<number> format. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Post update to Teams via Power Automate
        if: steps.resolve.outputs.skip == 'false'
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"task_id\": \"${{ steps.resolve.outputs.task_id }}\", \"status\": \"${{ steps.resolve.outputs.status }}\"}"
