name: aeon-development-progress-tracker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-teams:
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: Post progress update to Teams
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"task_id\": \"1\"}"
